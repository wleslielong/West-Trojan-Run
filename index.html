<title>West Trojan Run — Main Street</title>
<style>
  :root{
    --red:#CC0022;
    --red-dk:#8E0018;
    --blk:#141414;
    --bone:#F3EFE6;
    --gold:#E8B33C;
    --sky1:#8FC3E8;
    --sky2:#F6D9A8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0b0d;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;touch-action:none;overscroll-behavior:none;}
  #wrap{position:fixed;top:0;left:0;right:0;height:100%;height:var(--appvh,100%);
    display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:100%;height:100%;max-width:1000px;max-height:640px;overflow:hidden;background:#8FC3E8;}
  canvas{display:block;width:100%;height:100%;}

  /* Standalone (Home Screen) launch: drop the letterbox caps and fill the screen. */
  body.immersive #wrap{padding:0;}
  body.immersive #stage{max-width:none;max-height:none;width:100%;height:100%;}

  #hud{position:absolute;top:0;left:0;right:0;padding:9px 14px;display:flex;justify-content:space-between;
    align-items:flex-start;pointer-events:none;z-index:5;color:var(--bone);font-weight:800;
    text-shadow:0 2px 3px rgba(0,0,0,.55);font-size:14px;letter-spacing:.6px;}
  #hud .grp{display:flex;gap:14px;align-items:center;}
  #hud b{color:var(--gold);}
  #pw{position:absolute;top:34px;left:14px;z-index:5;pointer-events:none;color:var(--bone);
    font-weight:800;font-size:12px;letter-spacing:.5px;text-shadow:0 2px 3px rgba(0,0,0,.55);display:none;}
  #pwbar{width:110px;height:6px;background:rgba(0,0,0,.35);border-radius:3px;margin-top:3px;overflow:hidden;}
  #pwfill{height:100%;width:100%;background:var(--gold);}

  #msg{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;z-index:6;color:var(--bone);
    background:rgba(10,10,14,.62);padding:20px;}
  #msg.hidden{display:none;}
  #msg .badge{width:96px;height:96px;margin-bottom:8px;}
  #msg h1{margin:0 0 6px;font-size:clamp(24px,6vw,40px);letter-spacing:2px;color:var(--gold);
    text-shadow:0 3px 0 rgba(0,0,0,.5);}
  #msg h2{margin:0 0 10px;font-size:clamp(13px,3.2vw,17px);letter-spacing:1px;color:var(--bone);opacity:.85;font-weight:600;}
  #msg p{margin:2px 0;font-size:clamp(12px,3vw,15px);opacity:.85;max-width:420px;line-height:1.45;}
  #msg button{margin-top:16px;padding:13px 30px;border-radius:10px;border:none;background:var(--red);
    color:#fff;font-weight:800;font-size:16px;letter-spacing:1px;}
  #build{margin-top:14px;font-size:13px;font-weight:800;letter-spacing:1.6px;
    color:var(--gold);opacity:.95;}
  #jsflag{color:#FF8080;}
  #jsflag.ok{color:#7BE08A;}
  /* Version tag stays visible during play so you always know what's running. */
  #vtag{position:absolute;bottom:5px;right:10px;z-index:14;font-size:10px;font-weight:700;
    color:rgba(243,239,230,.6);letter-spacing:.5px;pointer-events:none;}
  /* Error bar lives OUTSIDE the start overlay so it shows during gameplay too. */
  #errbar{position:absolute;left:8px;right:8px;bottom:104px;z-index:40;display:none;
    background:rgba(150,10,22,.95);color:#fff;font-size:11px;font-weight:700;line-height:1.4;
    padding:9px 11px;border-radius:8px;border:1px solid #FF9A9A;word-break:break-word;
    max-height:40%;overflow:auto;-webkit-overflow-scrolling:touch;pointer-events:auto;}
  #errbar .hd{color:#FFD9D9;font-size:10px;letter-spacing:1px;margin-bottom:3px;}

  /* Math gate. Above #controls (z-index 10) so the d-pad cannot be poked while
     a question is up. Big targets — these are five-year-old thumbs. */
  #math{position:absolute;top:0;left:0;right:0;bottom:0;z-index:12;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,10,14,.9);color:var(--bone);padding:20px;text-align:center;}
  #math.hidden{display:none;}
  #mathTitle{font-size:13px;letter-spacing:2.4px;color:var(--gold);font-weight:800;margin-bottom:10px;}
  /* Emoji picture for the sight-word rounds. No image files, scales to any size. */
  #mathPic{font-size:clamp(54px,13vw,94px);line-height:1;margin-bottom:2px;}
  #mathQ{font-size:clamp(40px,11vw,76px);font-weight:900;letter-spacing:4px;color:#fff;
    text-shadow:0 4px 0 rgba(0,0,0,.45);margin-bottom:22px;}
  #mathChoices{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;}
  #mathChoices button{width:96px;height:96px;border-radius:22px;border:3px solid var(--gold);
    background:var(--red);color:#fff;font-size:42px;font-weight:900;padding:0;
    -webkit-appearance:none;appearance:none;transition:transform .06s,background .06s;}
  #mathChoices button:active{transform:scale(.9);background:var(--gold);color:var(--blk);}
  #mathMsg{margin-top:18px;font-size:16px;font-weight:800;letter-spacing:1px;
    min-height:24px;color:var(--gold);}
  /* Pulled well in from the screen edges. Flush to the bezel these are an
     uncomfortable thumb stretch on an iPad held in two hands. */
  #controls{position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;
    align-items:flex-end;pointer-events:none;padding:14px 58px;
    padding-left:calc(58px + env(safe-area-inset-left,0px));
    padding-right:calc(58px + env(safe-area-inset-right,0px));
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));}
  .dpad{display:flex;gap:12px;pointer-events:auto;}
  .btn{width:68px;height:68px;border-radius:16px;background:rgba(20,20,20,.5);
    border:2px solid rgba(243,239,230,.5);display:flex;align-items:center;justify-content:center;
    font-size:26px;color:var(--bone);transition:transform .06s,background .06s;}
  .btn.active{background:rgba(204,0,34,.6);border-color:var(--gold);transform:scale(.92);}
  #jumpBtn{width:86px;height:86px;border-radius:50%;background:rgba(204,0,34,.35);
    border:3px solid rgba(232,179,60,.7);pointer-events:auto;font-size:15px;font-weight:900;
    color:var(--bone);display:flex;align-items:center;justify-content:center;letter-spacing:1px;
    transition:transform .06s,background .06s;}
  #jumpBtn.active{background:rgba(232,179,60,.6);transform:scale(.9);}
  /* Hidden must win over the #msg button/div display rules above. */
  [hidden]{display:none !important;}
  /* Secondary to START, so it reads as an offer rather than the main action. */
  #msg #installBtn{margin-top:10px;padding:10px 22px;border-radius:9px;
    border:2px solid rgba(232,179,60,.75);background:transparent;color:var(--gold);
    font-weight:800;font-size:13px;letter-spacing:1px;}
  #msg #iosTip{margin-top:12px;font-size:12px;line-height:1.5;color:var(--bone);
    opacity:.72;max-width:330px;}
  #msg #iosTip b{color:var(--gold);}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="game"></canvas>

  <div id="vtag">v2.0</div>
  <div id="errbar"></div>

  <div id="hud">
    <div class="grp">
      <div>SCORE <b id="hScore">0</b></div>
      <div>FRUIT <b id="hFruit">0</b>/<b id="hFruitT">0</b></div>
    </div>
    <div class="grp"><div>LIVES <b id="hLives">3</b></div></div>
  </div>
  <div id="pw"><span id="pwName"></span><div id="pwbar"><div id="pwfill"></div></div></div>

  <div id="msg">
    <!-- Real West Trojans mark, inlined as a data URI so the file stays self-
         contained. The shield is pure white so the logo's own white ground
         blends into it invisibly — the JPEG has no alpha to key out.

<script>
(function(){
"use strict";

const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const stage=document.getElementById('stage'), msgEl=document.getElementById('msg');
const hScore=document.getElementById('hScore'), hFruit=document.getElementById('hFruit');
const hFruitT=document.getElementById('hFruitT'), hLives=document.getElementById('hLives');
const pwEl=document.getElementById('pw'), pwName=document.getElementById('pwName'), pwFill=document.getElementById('pwfill');

let DPR=Math.min(window.devicePixelRatio||1,2), VW=1000, VH=620, GROUND=0;
const CURB=64; // height of street band below sidewalk line
// Lava sits roughly halfway down the pit shaft, so you can read the hazard from
// the sidewalk instead of discovering it on the way down.
const PIT_DEPTH=CURB+26, LAVA_DROP=PIT_DEPTH*0.5;
let skyGrad=null, pitGrad=null, lavaGrad=null, CDPR=0, cacheOK=false;
const PADX=12, PADT=18;

function pickDPR(w,h){
  const raw=Math.min(window.devicePixelRatio||1,2), MAXPX=2100000;
  let d=raw;
  while(w*d*h*d>MAXPX && d>1) d-=0.25;

// iOS fires resize on every URL-bar collapse. Doing real work on each one is
// what exhausted canvas memory, so bail out unless something actually changed.
let lastW=0, lastH=0, resizeQueued=false;
function resize(){
  const r=stage.getBoundingClientRect();
  const w=Math.max(1,Math.round(r.width)), h=Math.max(1,Math.round(r.height));
  if(Math.abs(w-lastW)<2 && Math.abs(h-lastH)<2) return;
  lastW=w; lastH=h;
  const d=pickDPR(w,h);
  const cw=Math.round(w*d), chh=Math.round(h*d);
  if(canvas.width!==cw||canvas.height!==chh){ canvas.width=cw; canvas.height=chh; }
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  DPR=d;
  const oldG=GROUND; VW=w; VH=h; GROUND=VH-CURB-26;
  if(oldG&&isFinite(oldG)) P.y+=(GROUND-oldG);
  buildGradients();
  ensureBuildingCache();
  BUILDINGS.forEach(b=>{ b._cy=GROUND-b.h-PADT; }); // bitmaps unchanged, only placement
}
function queueResize(){
  if(resizeQueued) return;
  resizeQueued=true;
  requestAnimationFrame(()=>{ resizeQueued=false; try{ resize(); }catch(e){ reportErr(e); } });
}
function buildGradients(){
  try{
    skyGrad=ctx.createLinearGradient(0,0,0,Math.max(1,GROUND));
    skyGrad.addColorStop(0,'#6FB3E0'); skyGrad.addColorStop(.62,'#A9D4EC'); skyGrad.addColorStop(1,'#F6DEB4');
    pitGrad=ctx.createLinearGradient(0,GROUND,0,GROUND+PIT_DEPTH);
    pitGrad.addColorStop(0,'#2A2620'); pitGrad.addColorStop(1,'#140A06');
    lavaGrad=ctx.createLinearGradient(0,GROUND+LAVA_DROP,0,GROUND+PIT_DEPTH);
    lavaGrad.addColorStop(0,'#FFD861'); lavaGrad.addColorStop(.16,'#FF8A1E');
    lavaGrad.addColorStop(.55,'#E03A0B'); lavaGrad.addColorStop(1,'#8E0C04');
  }catch(e){ skyGrad=null; pitGrad=null; lavaGrad=null; }
}

// The cached storefront bitmaps are independent of GROUND, so they only need
// building once for the life of the page. Rebuilt only if pixel density changes.
function ensureBuildingCache(){
  const want=Math.min(DPR,1.5);
  if(cacheOK && Math.abs(want-CDPR)<0.01) return;
  CDPR=want;
  let budget=0;
  try{
    for(const b of BUILDINGS){
      const cw=b.w+PADX*2, ch=b.h+PADT+4;
      const pw=Math.max(1,Math.round(cw*CDPR)), ph=Math.max(1,Math.round(ch*CDPR));
      budget+=pw*ph;
      if(budget>9000000){ throw new Error('canvas budget'); }  // stay well under iOS cap
      let cv=b._cv;
      if(!cv){ cv=document.createElement('canvas'); b._cv=cv; }
      cv.width=pw; cv.height=ph;                                // reuse, don't reallocate
      const c=cv.getContext('2d');
      if(!c) throw new Error('no 2d context');
      c.setTransform(CDPR,0,0,CDPR,0,0);
      c.clearRect(0,0,cw,ch);
      c.translate(-(b.x-PADX), -(GROUND-b.h-PADT));
      paintBuilding(b,c);
      b._cx=b.x-PADX; b._cw=cw; b._ch=ch; b._cy=GROUND-b.h-PADT;
    }
    cacheOK=true;
  }catch(e){
    // Out of canvas memory or context unavailable: drop the bitmaps and paint
    // the storefronts directly. Slower, but it always works.
    cacheOK=false;
    BUILDINGS.forEach(b=>{ if(b._cv){ b._cv.width=1; b._cv.height=1; b._cv=null; } });
  }
}

let AC=null, voices=0;
function ensureAC(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  return AC;
}
// Every oscillator MUST be disconnected when it ends. Leaving them attached
// was piling up graph nodes until the audio thread gave out.
function tone(f1,f2,dur,type,vol){
  const ac=ensureAC(); if(!ac||ac.state==='closed') return;
  if(voices>6) return;                       // hard cap on simultaneous voices
  try{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f1,ac.currentTime);
    if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),ac.currentTime+dur);
    g.gain.setValueAtTime(vol||0.06,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    voices++;
    o.onended=function(){ try{o.disconnect(); g.disconnect();}catch(e){} voices=Math.max(0,voices-1); };
    o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}
function beep(f,dur,type,vol){ tone(f,f,dur,type,vol); }
function chirp(a,b,dur){ tone(a,b,dur,'square',0.06); }

/* ================= LEARNING GATE ================= */
// Aimed at 5-8 year olds: every start and every respawn is gated behind one
// question, alternating at random between an addition sum and a fill-in-the-
// missing-letter sight word. Answers are always buttons, never a text field —
// a keyboard on an iPad covers half the screen and the child loses the game
// behind it.
const mathEl=document.getElementById('math'), mathQ=document.getElementById('mathQ'),
      mathChoices=document.getElementById('mathChoices'), mathMsg=document.getElementById('mathMsg'),
      mathTitle=document.getElementById('mathTitle'), mathPic=document.getElementById('mathPic');
let mathAnswer='', mathThen=null;

// [word, picture, index of the missing letter, two wrong letters]
// Every one is a missing VOWEL, which is the phonics skill this age is drilling.
// Pictures are emoji rather than drawings: no extra files, and they render at
// any size, which keeps the single-file rule intact.
const SIGHT=[
  ['DOG','\uD83D\uDC15',1,'A','U'], ['CAT','\uD83D\uDC08',1,'E','O'],
  ['SUN','\u2600\uFE0F',1,'A','O'], ['PIG','\uD83D\uDC37',1,'A','O'],
  ['BUS','\uD83D\uDE8C',1,'A','I'], ['HAT','\uD83C\uDFA9',1,'O','U'],
  ['CUP','\uD83E\uDD64',1,'A','O'], ['BED','\uD83D\uDECF\uFE0F',1,'A','O'],
  ['FOX','\uD83E\uDD8A',1,'A','I'], ['BEE','\uD83D\uDC1D',1,'A','O'],
  ['DUCK','\uD83E\uDD86',1,'A','O'], ['FISH','\uD83D\uDC1F',1,'A','O'],
  ['FROG','\uD83D\uDC38',2,'A','U'], ['STAR','\u2B50',2,'E','O'],
  ['MOON','\uD83C\uDF19',1,'A','E'], ['CAKE','\uD83C\uDF70',1,'I','O'],
  ['BOAT','\u26F5',1,'A','E'],       ['TREE','\uD83C\uDF33',2,'A','O']
];

function gateChoices(opts,correct){
  mathAnswer=String(correct);
  for(let i=opts.length-1;i>0;i--){            // Fisher-Yates
    const j=Math.floor(Math.random()*(i+1)); const t=opts[i]; opts[i]=opts[j]; opts[j]=t;
  }
  mathChoices.innerHTML='';
  opts.forEach(function(v){
    const btn=document.createElement('button');
    btn.type='button'; btn.textContent=v;
    const pick=function(e){ if(e) e.preventDefault(); mathPick(v); };
    btn.addEventListener('touchstart',pick,{passive:false});
    btn.addEventListener('click',pick);
    mathChoices.appendChild(btn);
  });
}

function buildSum(){
  // The sum never exceeds 10. Both addends stay at least 1, so the smallest
  // problem is 1 + 1 and the largest totals 10.
  const total=2+Math.floor(Math.random()*9);        // 2..10
  const a=1+Math.floor(Math.random()*(total-1));    // 1..total-1
  mathTitle.textContent='SOLVE TO PLAY';
  mathPic.hidden=true; mathPic.textContent='';
  mathQ.textContent=a+' + '+(total-a)+' = ?';
  // Near misses rather than random numbers, so it cannot be solved by spotting
  // the only plausible answer. Distractors are capped at 10 too, so "never pick
  // the big one" is not a shortcut past actually adding.
  const opts=[total];
  let guard=0;
  while(opts.length<3 && guard++<80){
    const d=total+(Math.floor(Math.random()*7)-3);
    if(d>0 && d<=10 && opts.indexOf(d)<0) opts.push(d);
  }
  gateChoices(opts,total);
}

function buildWord(){
  const w=SIGHT[Math.floor(Math.random()*SIGHT.length)];
  const word=w[0], idx=w[2], correct=word.charAt(idx);
  mathTitle.textContent='FINISH THE WORD';
  mathPic.textContent=w[1]; mathPic.hidden=false;
  // Spaced out so the blank reads as a gap rather than an underscore in a word.
  let shown='';
  for(let i=0;i<word.length;i++) shown+=(i?' ':'')+(i===idx?'_':word.charAt(i));
  mathQ.textContent=shown;
  gateChoices([correct,w[3],w[4]],correct);
}

function askMath(then){
  mathThen=then;
  mathMsg.textContent='';
  if(Math.random()<0.5) buildSum(); else buildWord();
  state='math';
  msgEl.classList.add('hidden');
  mathEl.classList.remove('hidden');
}

function mathPick(v){
  if(String(v)===mathAnswer){
    mathEl.classList.add('hidden');
    chirp(600,1200,.18);
    const t=mathThen; mathThen=null;
    if(t) t();
  } else {
    // A wrong answer costs another go and nothing else. Taking a life for a
    // wrong sum is not what this gate is for.
    mathMsg.textContent='Not quite \u2014 try again!';
    beep(200,.18,'square',.05);
  }
}

/* ================= UPDATE ================= */
function update(){
  updateBackground();
  // Death pause: hold the frame the player died on so they can see what got
  // them, then hand off to afterDeath().
  if(state==='dying'){ if(--dieT<=0) afterDeath(); return; }
  if(state!=='play') return;
  // Power-up transform: everything holds still while the Trojan changes.
  if(P.tf>0){ P.tf--; return; }
  P.anim++;

  // horizontal
  if(IN.l&&!IN.r){P.vx=-MOVE;P.face=-1;}
  else if(IN.r&&!IN.l){P.vx=MOVE;P.face=1;}
  else P.vx*=0.6;
  P.x+=P.vx;
  if(P.x<16)P.x=16; if(P.x>WORLD+60)P.x=WORLD+60;

  // jump
  const jv = P.hi>0 ? JUMP_HI : JUMP_V;
  if(IN.jumpQ){
    if(P.onGround||P.coyote>0){ P.vy=-jv; P.onGround=false; P.coyote=0; puff(P.x,GROUND,'#D8D2C4'); chirp(360,720,.11); }
    IN.jumpQ=false;
  }
  if(!IN.jumpHold && P.vy<-3) P.vy*=0.86; // variable jump height

  // gravity + vertical
  const prevBottom=P.y+P.h;
  P.vy+=GRAVITY; if(P.vy>17)P.vy=17;
  P.y+=P.vy;
  let bottom=P.y+P.h, landed=false;

  // one-way platforms
  if(P.vy>=0){
    for(const pl of PLATS){
      const pTop=GROUND-pl.hA;
      if(P.x+P.w*0.5>pl.x && P.x-P.w*0.5<pl.x+pl.w){
        if(prevBottom<=pTop+2 && bottom>=pTop){
          P.y=pTop-P.h; P.vy=0; landed=true; break;
        }
      }
    }
  }
  // ground
  if(!landed && P.vy>=0 && (P.y+P.h)>=GROUND && !overPit(P.x)){
    P.y=GROUND-P.h; P.vy=0; landed=true;
  }
  P.onGround=landed;
  P.coyote = landed?7:Math.max(0,P.coyote-1);

  // Hit the lava. Fires at the pool surface rather than 240px down, so the
  // player is still on screen when the death pause freezes the frame.
  if(P.y+P.h>GROUND+LAVA_DROP+6){ hurt(true); return; }

  // timers
  if(P.inv>0){P.inv--; if(P.inv===0)clearPw();}
  if(P.hi>0){P.hi--; if(P.hi===0&&P.inv<=0)clearPw();}
  if(P.invuln>0)P.invuln--;
  updatePw();

  // enemies
  for(const e of enemies){
    if(!e.alive)continue;
    e.x+=e.dir*e.speed;
    if(e.x<e.min){e.x=e.min;e.dir=1;} if(e.x>e.max){e.x=e.max;e.dir=-1;}
    // spin was a tumbleweed roll; for the snake it is just a slither phase, so it
    // advances at its own rhythm instead of tracking travel direction.
    if(e.type==='snake') e.spin+=0.18;
    const ey=GROUND-e.hA-e.h;
    if(Math.abs(P.x-e.x)<(P.w*0.5+e.w*0.5-6) && P.y+P.h>ey && P.y<ey+e.h){
      if(P.inv>0){ e.alive=false; score+=200; pop(e.x,ey,'200'); puff(e.x,GROUND-e.hA,'#E8B33C'); beep(700,.09); }
      else if(P.vy>1.5 && prevBottom<=ey+14){
        e.alive=false; P.vy=-jv*0.62; score+=200; pop(e.x,ey,'200'); puff(e.x,GROUND-e.hA,'#C9B48C'); chirp(600,240,.1);
      } else if(P.invuln<=0){ hurt(false); return; }
    }
  }

  // fruit
  for(const f of fruit){
    if(f.taken)continue;
    const fy=GROUND-f.hA;
    if(Math.abs(P.x-f.x)<26 && Math.abs((P.y+P.h*0.5)-fy)<28){
      f.taken=true; fruitGot++; score+=FRUIT_VAL[f.kind];
      pop(f.x,fy,'+'+FRUIT_VAL[f.kind]); puff(f.x,fy,'#F2C14E'); beep(880,.07,'square',.05);
    }
  }

  // powerups
  for(const u of POWERS){
    if(u.taken)continue;
    const uy=GROUND-u.hA;
    if(Math.abs(P.x-u.x)<30 && Math.abs((P.y+P.h*0.5)-uy)<32){
      u.taken=true; grab(u.kind,u.x,uy);
    }
  }

  // checkpoints
  for(const c of CHECKPOINTS){
    if(!c.hit && P.x>c.x){ c.hit=true; spawnX=c.x; score+=250; pop(c.x,GROUND-70,'CHECKPOINT'); chirp(440,880,.2); }
  }

  // goal
  if(P.x>=GOAL_X){
    state='win'; score+=Math.max(0,(fruit.length-fruitGot)===0?1000:0);
    chirp(523,1046,.35);
    showMsg('TOUCHDOWN!','MAIN STREET CLEARED',
      ['Score '+score+' · Fruit '+fruitGot+'/'+fruit.length+(fruitGot===fruit.length?' (+1000 perfect bonus)':''),
       'Run it back and see if you can clear every piece of fruit.'],'RUN AGAIN');
  }

  // camera
  const target=Math.max(0,Math.min(WORLD-VW+120,P.x-VW*0.34));
  camX+=(target-camX)*0.13;

  syncHUD();

  parts.forEach(p=>{p.life--;p.x+=p.vx;p.y+=p.vy;p.vy+=0.28;});
  parts=parts.filter(p=>p.life>0);
  if(parts.length>140) parts.splice(0,parts.length-140);
  pops.forEach(p=>{p.life--;p.y-=0.9;});
  pops=pops.filter(p=>p.life>0);
  if(pops.length>24) pops.splice(0,pops.length-24);
}

// Power-ups, redefined in 1.8:
//   Kolache      -> invincible for 6s
//   Cowboy Boots -> 1.5x jump HEIGHT for 6s
//   Lone Star    -> 2x size, no timer, held until a bad guy touches you
const PW_SECS=6*60;

// Mario-style transform: freeze everything for a beat and flicker the character
// between its old and new size, so a power-up reads as an event rather than the
// player silently changing shape mid-stride.
function startTransform(){ P.tfPrevH=P.h; P.tf=42; }

function grab(kind,x,y){
  startTransform();
  if(kind==='kolache'){
    P.inv=PW_SECS; score+=500; pop(x,y,'INVINCIBLE'); chirp(500,1200,.3);
    setPw('KOLACHE \u2014 INVINCIBLE',PW_SECS);
  } else if(kind==='star'){
    if(!P.big){ P.big=true; P.w=P_BIG_W; P.h=P_BIG_H; P.y-=(P_BIG_H-P_H); }
    score+=500; pop(x,y,'BIG TROJAN'); chirp(300,760,.22);
  } else {
    P.hi=PW_SECS; score+=500; pop(x,y,'HIGH JUMP'); chirp(400,1000,.25);
    setPw('COWBOY BOOTS \u2014 HIGH JUMP',PW_SECS);
  }
  puff(x,y,'#E8B33C');
}
let pwMax=1;
function setPw(name,t){ pwName.textContent=name; pwMax=t; pwEl.style.display='block'; }
function updatePw(){
  const t=Math.max(P.inv,P.hi);
  if(t>0){ pwFill.style.width=Math.round(t/pwMax*100)+'%'; }
}
function clearPw(){ if(P.inv<=0&&P.hi<=0) pwEl.style.display='none'; }

// A checkpoint that lands inside a pit is an instant death loop: respawn, fall,
// respawn. Nudge clear of any pit rather than trusting the checkpoint data.
function safeSpawn(x){
  for(const p of PITS){ if(x>p.x-30 && x<p.x+p.w+30) return p.x+p.w+46; }
  return x;
}

function hurt(pit){
  if(!pit && P.big){
    P.big=false; P.w=P_W; P.h=P_H; P.invuln=110;
    puff(P.x,P.y+20,'#F0D9A8'); beep(200,.18,'square',.05);
    return;
  }
  // Freeze on the spot for a second before respawning. Young players need to
  // see what actually killed them; an instant cut to the checkpoint teaches
  // them nothing.
  state='dying'; dieT=60;
  beep(160,.35,'sawtooth',.06);
  puff(P.x,P.y+P.h*0.5,'#CC0022');
}
function afterDeath(){
  lives--; syncHUD();
  if(lives<=0){
    state='over';
    showMsg('GAME OVER','MAIN STREET \u00b7 WEST, TEXAS',
      ['Score '+score+' \u00b7 Fruit '+fruitGot+'/'+fruit.length,'Tap below to start a fresh run.'],'TRY AGAIN');
  } else {
    askMath(function(){ reset(false); });
  }
}

function puff(x,y,c){ for(let i=0;i<9;i++) parts.push({x,y,vx:(Math.random()-.5)*4.4,vy:-(Math.random()*3+.6),life:22+Math.random()*10,c}); }
function pop(x,y,t){ pops.push({x,y,t,life:52}); }

function updateBackground(){
  clouds.forEach(c=>{ c.x+=c.sp; if(c.x>WORLD+400)c.x=-300; });
  if(train){
    train.x+=train.dir*train.sp;
    const sx=train.x-camX*0.55;
    // else-if matters: the first branch nulls train, and the second used to
    // dereference it on the same tick, throwing once per eastbound train.
    if(train.dir>0 && sx>VW+900) train=null;
    else if(train.dir<0 && sx<-1900) train=null;
  } else {
    trainTimer--;
    if(trainTimer<=0){
      const dir=Math.random()<0.5?1:-1;
      train={dir,sp:3.4,cars:5+Math.floor(Math.random()*4),
        x: camX*0.55 + (dir>0? -1500 : VW+600)};
      trainTimer=520+Math.floor(Math.random()*420);
      if(state==='play') horn();
    }
  }
}

/* ================= DRAW ================= */
function draw(){
  ctx.save(); ctx.scale(DPR,DPR); ctx.clearRect(0,0,VW,VH);
  drawSky(); drawFarLayer(); drawTrainLayer(); drawStreetAndBuildings();
  ctx.restore();
}

function drawSky(){
  ctx.fillStyle=skyGrad||'#A9D4EC'; ctx.fillRect(0,0,VW,GROUND+CURB+26);
  // sun
  ctx.fillStyle='rgba(255,238,190,.85)'; ctx.beginPath(); ctx.arc(VW*0.78,72,34,0,6.3); ctx.fill();
  // clouds
  ctx.fillStyle='rgba(255,255,255,.8)';
  clouds.forEach(c=>{
    const x=c.x-camX*0.14; if(x<-260||x>VW+260)return;
    const s=c.s;
    ctx.beginPath();
    ctx.ellipse(x,c.y,44*s,20*s,0,0,6.3);
    ctx.ellipse(x+34*s,c.y+6*s,32*s,15*s,0,0,6.3);
    ctx.ellipse(x-34*s,c.y+7*s,28*s,13*s,0,0,6.3);
    ctx.fill();
  });
}

function drawFarLayer(){
  const px=camX*0.28;
  // treeline
  ctx.fillStyle='#7FA36B';
  for(let i=-1;i<Math.ceil(VW/90)+3;i++){
    const x=((i*90-px)%(90*(Math.ceil(VW/90)+4)))+ -90;
    ctx.beginPath(); ctx.arc(x,GROUND-96,44,Math.PI,0); ctx.fill();
  }
  // grain silos
  const silo=((-px*0.9)%2200+2200)%2200 - 300;
  drawSilos(silo,GROUND-92);
  drawSilos(silo+1150,GROUND-92);
  // water tower "WEST"
  drawWaterTower(((-px*0.9)%2200+2200)%2200 + 640, GROUND-96);
  // The school is a one-off landmark, not tiled scenery like the silos, so it
  // is anchored to a world position instead of a modulo, drifting in at
  // far-layer parallax as you approach the end of the street.
  // The offset is tuned against the camera's final clamped position, where the
  // last stretch of street is open sky. Centred, the school's name board sat
  // behind the GO TROJANS banner and neither read; further left it disappeared
  // behind the Spirit Shop. VW*0.66 parks it in the clear gap past the goal, fully on screen.
  drawSchool((GOAL_X-camX)*0.28 + VW*0.66, GROUND-92);
}
function drawSilos(x,baseY){
  ctx.fillStyle='#CFCBBF';
  for(let i=0;i<4;i++){ ctx.fillRect(x+i*26,baseY-118,24,118); }
  ctx.fillStyle='#9E9A8E';
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(x+i*26+12,baseY-118,12,Math.PI,0); ctx.fill(); }
  ctx.fillStyle='#7C776B'; ctx.fillRect(x,baseY-126,4*26-2,7);
}
function drawWaterTower(x,baseY){
  ctx.strokeStyle='#8A8578'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(x-22,baseY); ctx.lineTo(x-10,baseY-72);
  ctx.moveTo(x+22,baseY); ctx.lineTo(x+10,baseY-72);
  ctx.moveTo(x-18,baseY-30); ctx.lineTo(x+18,baseY-30); ctx.stroke();
  ctx.fillStyle='#D8D4C8'; ctx.beginPath();
  ctx.moveTo(x-30,baseY-72); ctx.lineTo(x+30,baseY-72); ctx.lineTo(x+24,baseY-108);
  ctx.lineTo(x-24,baseY-108); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#8E0018'; ctx.beginPath();
  ctx.moveTo(x-24,baseY-108); ctx.lineTo(x+24,baseY-108); ctx.lineTo(x,baseY-126); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#CC0022'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('WEST',x,baseY-84);
}
// Real West Trojans mark. The artwork lives in exactly one place — the data URI
// on #logoImg in the badge SVG up in the markup — and this reads it back rather
// than carrying a second 16KB copy of the same base64.
const LOGO=new Image(); let logoOK=false;
LOGO.onload=function(){ logoOK=true; };
try{
  var _li=document.getElementById('logoImg');
  if(_li) LOGO.src=_li.getAttribute('href')||_li.getAttribute('xlink:href')||'';
}catch(e){}

// The mark is opaque with a white ground (the source is a JPEG, no alpha to key
// out), so whatever it lands on has to be white or the ground shows as a box.
// That is why the badge shield and the school plaque are both pure white.
function drawTrojanLogo(cx,cy,size){
  if(!logoOK) return;
  ctx.drawImage(LOGO,cx-size/2,cy-size/2,size,size);
}
function drawSchool(x,baseY){
  if(x>VW+260||x<-260)return;
  // Deliberately taller than the silos. The far layer sits behind the
  // storefronts, and at 98px the whole building hid behind a single shopfront —
  // only the flagpole showed. It has to clear the roofline to read at all.
  const W=230, H=132, hw=W/2, top=baseY-H;

  // main block, Trojan red with darker brick courses
  ctx.fillStyle='#A5102A'; ctx.fillRect(x-hw,top,W,H);
  ctx.fillStyle='#8E0018';
  for(let i=1;i<8;i++) ctx.fillRect(x-hw,top+i*16,W,2);
  ctx.fillStyle='#16161A'; ctx.fillRect(x-hw,baseY-18,W,18);       // base course
  ctx.fillStyle='#16161A'; ctx.fillRect(x-hw-8,top-11,W+16,12);    // roof cap

  // raised centre gable over the entrance
  ctx.fillStyle='#16161A';
  ctx.beginPath();
  ctx.moveTo(x-52,top-11); ctx.lineTo(x+52,top-11); ctx.lineTo(x,top-56);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#C01230';
  ctx.beginPath();
  ctx.moveTo(x-41,top-15); ctx.lineTo(x+41,top-15); ctx.lineTo(x,top-48);
  ctx.closePath(); ctx.fill();
  // school crest on a white plaque — the mark is opaque with a white ground

  ctx.fillStyle='#FFFFFF';
  ctx.beginPath(); ctx.arc(x,top-26,19,0,6.3); ctx.fill();
  drawTrojanLogo(x,top-26,25);

  // flagpole
  ctx.strokeStyle='#9A9488'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x-86,top-11); ctx.lineTo(x-86,top-74); ctx.stroke();
  ctx.fillStyle='#CC0022'; ctx.fillRect(x-85,top-74,19,12);

  // name board
  ctx.fillStyle='#16161A'; ctx.fillRect(x-hw+9,top+7,W-18,22);
  ctx.fillStyle='#E8B33C';
  ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('WEST ELEMENTARY',x,top+23);

  // windows, two rows, lower row skipping the doorway bay
  for(let r=0;r<2;r++) for(let i=0;i<9;i++){
    const wx=x-hw+14+i*25, wy=top+42+r*36;
    if(r===1 && Math.abs(wx+9-x)<30) continue;
    ctx.fillStyle='#F2E7C6'; ctx.fillRect(wx,wy,18,26);
    ctx.strokeStyle='#8E0018'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(wx+9,wy); ctx.lineTo(wx+9,wy+26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx,wy+13); ctx.lineTo(wx+18,wy+13); ctx.stroke();
  }

  // doors
  ctx.fillStyle='#C01230'; ctx.fillRect(x-25,baseY-56,50,6);
  ctx.fillStyle='#16161A'; ctx.fillRect(x-20,baseY-50,40,32);
  ctx.fillStyle='#E8B33C'; ctx.fillRect(x-1,baseY-50,2,32);
}

function drawTrainLayer(){
  const px=camX*0.55;
  const ty=GROUND-118, railY=ty+52;
  // embankment + rails
  ctx.fillStyle='#B6A98F'; ctx.fillRect(0,railY,VW,16);
  ctx.fillStyle='#6E6152';
  const tieOff=((-px)%22+22)%22;
  for(let x=-22+tieOff;x<VW+22;x+=22){ ctx.fillRect(x,railY+3,10,12); }
  ctx.fillStyle='#8C8577'; ctx.fillRect(0,railY+1,VW,3);
  if(train){
    const bx=train.x-px;
    drawTrain(bx,railY,train.dir,train.cars);
  }
}
function drawTrain(x,railY,dir,cars){
  const y=railY-46;
  ctx.save();
  if(dir<0){ ctx.translate(x,0); ctx.scale(-1,1); ctx.translate(-x,0); }
  // locomotive
  ctx.fillStyle='#2C2C30'; ctx.fillRect(x,y+10,110,36);
  ctx.fillStyle='#1C1C20'; ctx.fillRect(x+72,y-6,36,22);
  ctx.fillStyle='#7FB8D8'; ctx.fillRect(x+78,y-2,24,12);
  ctx.fillStyle='#CC0022'; ctx.fillRect(x,y+10,110,5);
  ctx.fillStyle='#141414';
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(x+16+i*26,railY+2,7,0,6.3); ctx.fill(); }
  // cars
  for(let c=0;c<cars;c++){
    const cx=x-((c+1)*104);
    ctx.fillStyle= c%2? '#6E5A3E':'#4A5A6E';
    ctx.fillRect(cx,y+12,96,34);
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(cx+8,y+18,80,8);
    ctx.fillStyle='#141414';
    ctx.beginPath(); ctx.arc(cx+18,railY+2,6,0,6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+78,railY+2,6,0,6.3); ctx.fill();
  }
  ctx.restore();
}

function drawStreetAndBuildings(){
  ctx.save(); ctx.translate(-camX,0);

  // buildings
  BUILDINGS.forEach(b=>{
    const sx=b.x-camX; if(sx>VW+60||sx+b.w<-60) return;
    if(cacheOK && b._cv && b._cv.width>1 && b._cv.height>1){
      try{ ctx.drawImage(b._cv,b._cx,b._cy,b._cw,b._ch); return; }catch(e){ cacheOK=false; }
    }
    paintBuilding(b,ctx);
  });

  // sidewalk + street
  const sw=GROUND, st=GROUND+26;
  ctx.fillStyle='#CFC8B8'; ctx.fillRect(camX-40,sw,VW+80,26);
  ctx.fillStyle='#B8B0A0'; ctx.fillRect(camX-40,sw,VW+80,4);
  ctx.fillStyle='#4A4A4E'; ctx.fillRect(camX-40,st,VW+80,CURB);
  // sidewalk seams
  ctx.fillStyle='rgba(0,0,0,.10)';
  for(let x=Math.floor(camX/48)*48-48;x<camX+VW+48;x+=48) ctx.fillRect(x,sw,2,26);
  // center line
  ctx.fillStyle='#E8CE6A';
  for(let x=Math.floor(camX/60)*60-60;x<camX+VW+60;x+=60) ctx.fillRect(x,st+CURB*0.62,32,4);

  // pits (cut out street + hazard barrels)
  PITS.forEach(p=>{
    const sx=p.x-camX; if(sx>VW+80||sx+p.w<-80)return;
    const lavaY=sw+LAVA_DROP, t=Date.now()/420;

    // shaft
    ctx.fillStyle=pitGrad||'#1A1712'; ctx.fillRect(p.x,sw,p.w,PIT_DEPTH);
    ctx.fillStyle='#3A342B'; ctx.fillRect(p.x,sw,p.w,5);

    // heat on the shaft walls above the pool. A drawn band, not shadowBlur —
    // shadowBlur is banned here, it wrecks Safari's frame rate.
    ctx.globalAlpha=0.30; ctx.fillStyle='#FF7A18';
    ctx.fillRect(p.x,lavaY-12,p.w,12);
    ctx.globalAlpha=0.16;
    ctx.fillRect(p.x,lavaY-26,p.w,14);
    ctx.globalAlpha=1;

    // the pool itself
    ctx.fillStyle=lavaGrad||'#D2321A';
    ctx.fillRect(p.x,lavaY,p.w,PIT_DEPTH-LAVA_DROP);

    // molten surface, bobbing in three segments so it never sits dead flat
    const seg=p.w/3;
    ctx.fillStyle='#FFE58A';
    for(let i=0;i<3;i++){
      const bob=Math.sin(t+p.x*0.013+i*1.9)*1.5;
      ctx.fillRect(p.x+i*seg+1, lavaY-1+bob, seg-2, 3);
    }
    // slow bubbles
    ctx.fillStyle='#FFB03A';
    for(let i=0;i<2;i++){
      const ph=(t*0.55+i*0.5+p.x*0.007)%1;
      const bx=p.x+seg*(0.6+i*1.5), by=lavaY+(PIT_DEPTH-LAVA_DROP)*(1-ph)*0.7;
      ctx.globalAlpha=0.35*(1-ph);
      ctx.beginPath(); ctx.arc(bx,by,1.6+ph*2.2,0,6.3); ctx.fill();
    }
    ctx.globalAlpha=1;

    drawBarrel(p.x-12,sw); drawBarrel(p.x+p.w+12,sw);
  });

  // platforms
  PLATS.forEach(pl=>{
    const sx=pl.x-camX; if(sx>VW+60||sx+pl.w<-60)return;
    const py=GROUND-pl.hA;
    if(pl.kind==='crate'){
      ctx.fillStyle='#A8763F'; ctx.fillRect(pl.x,py,pl.w,pl.th);
      ctx.fillStyle='#7A5329'; ctx.fillRect(pl.x,py,pl.w,4);
      ctx.strokeStyle='#7A5329'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(pl.x,py); ctx.lineTo(pl.x+pl.w,py+pl.th);
      ctx.moveTo(pl.x+pl.w,py); ctx.lineTo(pl.x,py+pl.th); ctx.stroke();
    } else if(pl.kind==='ledge'){
      ctx.fillStyle='#9A9384'; ctx.fillRect(pl.x,py,pl.w,pl.th);
      ctx.fillStyle='#C6BFAE'; ctx.fillRect(pl.x,py,pl.w,4);
    }
    // awnings drawn with their building
  });

  // fruit
  fruit.forEach(f=>{
    if(f.taken)return;
    const sx=f.x-camX; if(sx>VW+40||sx<-40)return;
    const y=GROUND-f.hA+Math.sin(Date.now()/340+f.bob)*3.5;
    drawFruit(f.kind,f.x,y);
  });

  // powerups
  POWERS.forEach(u=>{
    if(u.taken)return;
    const sx=u.x-camX; if(sx>VW+40||sx<-40)return;
    const y=GROUND-u.hA+Math.sin(Date.now()/260+u.x)*4;
    drawPower(u.kind,u.x,y);
  });

  // checkpoints
  CHECKPOINTS.forEach(c=>{
    const sx=c.x-camX; if(sx>VW+60||sx<-60)return;
    ctx.fillStyle='#8A8578'; ctx.fillRect(c.x-2,GROUND-84,4,84);
    ctx.fillStyle=c.hit?'#CC0022':'#8E8B82';
    ctx.fillRect(c.x-24,GROUND-92,48,26);
    ctx.fillStyle='#FFFFFF'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('WEST',c.x,GROUND-74);
  });

  // enemies
  enemies.forEach(e=>{
    if(!e.alive)return;
    const sx=e.x-camX; if(sx>VW+60||sx<-60)return;
    const y=GROUND-e.hA-e.h;
    if(e.type==='scorp') drawScorpion(e.x,y,e.w,e.h,e.dir);
    else drawRattler(e.x,y,e.w,e.h,e.spin,e.dir);
  });

  drawGoal(GOAL_X,GROUND);

  // particles
  parts.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/28); ctx.fillStyle=p.c;
    ctx.fillRect(p.x-3,p.y-3,6,6); ctx.globalAlpha=1;
  });

  // player
  drawTrojan();

  // score pops
  ctx.textAlign='center'; ctx.font='bold 15px sans-serif';
  pops.forEach(p=>{
    ctx.globalAlpha=Math.min(1,p.life/26);
    ctx.fillStyle='#141414'; ctx.fillText(p.t,p.x+1,p.y+1);
    ctx.fillStyle='#FFE28A'; ctx.fillText(p.t,p.x,p.y);
    ctx.globalAlpha=1;
  });

  ctx.restore();
}

function drawBarrel(x,y){
  ctx.fillStyle='#E86A1E'; ctx.fillRect(x-8,y-30,16,30);
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(x-8,y-24,16,5); ctx.fillRect(x-8,y-12,16,5);
}

function paintBuilding(b,c){
  const baseY=GROUND, topY=GROUND-b.h;
  // facade
  c.fillStyle=b.face; c.fillRect(b.x,topY,b.w,b.h);
  // brick texture
  if(b.style==='brick'){
    c.fillStyle='rgba(0,0,0,.055)';
    for(let y=topY+8;y<baseY-8;y+=12){
      for(let x=b.x+((Math.floor((y-topY)/12)%2)?0:11);x<b.x+b.w-8;x+=22) c.fillRect(x,y,18,7);
    }
  }
  if(b.style==='stone'){
    c.fillStyle='rgba(0,0,0,.05)';
    for(let y=topY+10;y<baseY-10;y+=22) c.fillRect(b.x+4,y,b.w-8,2);
  }
  // cornice
  c.fillStyle=b.trim; c.fillRect(b.x-6,topY-12,b.w+12,14);
  c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(b.x-6,topY+2,b.w+12,4);
  // Sign band. A name too long for one readable line wraps to two, rather than
  // shrinking until nobody can read it — "GUARDIAN PAYMENT SERVICES" was down
  // to 12px on a 200px shopfront.
  //
  // The band grows UPWARD: its BOTTOM edge stays pinned at topY+52. Every fruit
  // and ledge clearance in this file is measured from that edge (h-52 above
  // ground), so growing downward would silently put the sign back under them.
  // There is room above — the cornice sits at topY-12..topY+2.
  const name=b.name.replace('&amp;','&');
  let fs=Math.min(16, (b.w-28)/(name.length*0.56));
  let lines=[name];
  if(fs<13){
    const words=name.split(' ');
    if(words.length>1){
      let best=1, bestDiff=1e9;
      for(let i=1;i<words.length;i++){
        const d=Math.abs(words.slice(0,i).join(' ').length - words.slice(i).join(' ').length);
        if(d<bestDiff){ bestDiff=d; best=i; }   // split closest to even halves
      }
      lines=[words.slice(0,best).join(' '), words.slice(best).join(' ')];
      fs=Math.min(15, (b.w-28)/(Math.max(lines[0].length,lines[1].length)*0.56));
    }
  }
  const bandH=(lines.length>1)?44:30;
  const signY=topY+52-bandH;
  c.fillStyle='rgba(20,20,20,.82)'; c.fillRect(b.x+10,signY,b.w-20,bandH);
  c.fillStyle=b.trim; c.fillRect(b.x+10,signY,b.w-20,3);
  c.textAlign='center'; c.fillStyle='#F6F2E8';
  c.font='bold '+fs.toFixed(1)+'px sans-serif';
  if(lines.length>1){
    c.fillText(lines[0],b.x+b.w/2,signY+20);
    c.fillText(lines[1],b.x+b.w/2,signY+38);
  } else {
    c.fillText(lines[0],b.x+b.w/2,signY+20);
  }
  if(b.sub){
    c.fillStyle='#C9C3B4'; c.font='bold 9px sans-serif';
    c.fillText(b.sub,b.x+b.w/2,topY+65);
  }
  // windows
  const wTop=signY+56, wH=Math.max(28, b.h-(wTop-topY)-b.hA-40);
  if(wH>20){
    c.fillStyle='rgba(60,80,100,.55)';
    const cols=Math.max(2,Math.floor(b.w/64));
    const gap=(b.w-20)/cols;
    for(let i=0;i<cols;i++){
      c.fillRect(b.x+12+i*gap, wTop, gap-14, Math.min(wH,52));
      c.fillStyle='rgba(255,255,255,.18)';
      c.fillRect(b.x+12+i*gap, wTop, (gap-14)*0.4, Math.min(wH,52));
      c.fillStyle='rgba(60,80,100,.55)';
    }
  }
  // awning (also the platform surface)
  const ay=GROUND-b.hA;
  c.fillStyle=b.trim; c.fillRect(b.x-6,ay,b.w+12,14);
  c.fillStyle='rgba(255,255,255,.32)';
  for(let i=0;i<Math.floor((b.w+12)/22);i++) c.fillRect(b.x-6+i*22,ay,11,14);
  c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(b.x-6,ay+12,b.w+12,4);
  // storefront under awning
  c.fillStyle='rgba(40,50,60,.35)'; c.fillRect(b.x+8,ay+16,b.w-16,GROUND-ay-16);
  c.fillStyle=b.trim; c.fillRect(b.x+b.w*0.5-16,ay+22,32,GROUND-ay-22);
  c.fillStyle='rgba(255,255,255,.22)'; c.fillRect(b.x+14,ay+22,b.w*0.3,GROUND-ay-30);
}

function drawFruit(kind,x,y){
  ctx.save(); ctx.translate(x,y);
  if(kind==='apple'){
    ctx.fillStyle='#D93027'; ctx.beginPath(); ctx.arc(-4,0,8,0,6.3); ctx.arc(4,0,8,0,6.3); ctx.fill();
    ctx.strokeStyle='#6B4A2A'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(2,-13); ctx.stroke();
    ctx.fillStyle='#3E9B4F'; ctx.beginPath(); ctx.ellipse(7,-12,6,3,-0.5,0,6.3); ctx.fill();
  } else if(kind==='banana'){
    ctx.strokeStyle='#F2C230'; ctx.lineWidth=8; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,-4,11,0.35,2.79); ctx.stroke();
    ctx.strokeStyle='#D9A31C'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,-2,11,0.5,2.6); ctx.stroke();
    ctx.fillStyle='#6B4A2A'; ctx.fillRect(-13,-6,4,4);
  } else if(kind==='strawberry'){
    ctx.fillStyle='#E23B3B'; ctx.beginPath();
    ctx.moveTo(-9,-4); ctx.quadraticCurveTo(0,-12,9,-4); ctx.quadraticCurveTo(6,11,0,13);
    ctx.quadraticCurveTo(-6,11,-9,-4); ctx.fill();
    ctx.fillStyle='#FFE9A8';
    for(let i=0;i<6;i++) ctx.fillRect(-6+ (i%3)*5, -2+Math.floor(i/3)*6, 2,2);
    ctx.fillStyle='#3E9B4F'; ctx.beginPath();
    ctx.moveTo(-9,-5); ctx.lineTo(0,-11); ctx.lineTo(9,-5); ctx.lineTo(0,-2); ctx.fill();
  } else if(kind==='watermelon'){
    ctx.fillStyle='#2F7D3E'; ctx.beginPath(); ctx.arc(0,4,13,Math.PI,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#EAF3D8'; ctx.beginPath(); ctx.arc(0,4,10.5,Math.PI,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#F0576B'; ctx.beginPath(); ctx.arc(0,4,8.5,Math.PI,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#2B2B2B';
    ctx.fillRect(-5,-2,2,3); ctx.fillRect(3,-2,2,3); ctx.fillRect(-1,-5,2,3);
  } else {
    ctx.fillStyle='#F08C1E'; ctx.beginPath(); ctx.arc(0,0,10,0,6.3); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(-3,-3,5,0,6.3); ctx.stroke();
    ctx.fillStyle='#3E9B4F'; ctx.beginPath(); ctx.ellipse(5,-10,6,3,-0.6,0,6.3); ctx.fill();
  }
  ctx.restore();
}

function drawPower(kind,x,y){
  // Blink hard and bob. These are the most important pickups on screen for a
  // young player, and the old static glow did not read as "come get me".
  const t=Date.now();
  const blink=0.55+0.45*Math.sin(t/110);
  const glow=0.5+0.5*Math.sin(t/180);
  ctx.save(); ctx.translate(x,Math.sin(t/320)*3.5);
  ctx.translate(0,y);
  ctx.globalAlpha=(0.20+glow*0.30)*blink; ctx.fillStyle='#FFE9A8';
  ctx.beginPath(); ctx.arc(0,0,17+glow*7,0,6.3); ctx.fill();
  ctx.globalAlpha=0.55*blink; ctx.strokeStyle='#FFF3C4'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,21+glow*8,0,6.3); ctx.stroke();
  ctx.globalAlpha=0.62+0.38*blink;
  if(kind==='kolache'){
    ctx.fillStyle='#E8C077'; ctx.beginPath(); ctx.ellipse(0,0,15,12,0,0,6.3); ctx.fill();
    ctx.fillStyle='#C89A52'; ctx.beginPath(); ctx.ellipse(0,0,15,12,0,0,6.3); ctx.stroke===null;
    ctx.fillStyle='#B0442F'; ctx.beginPath(); ctx.ellipse(0,-1,7,5.5,0,0,6.3); ctx.fill();
    ctx.fillStyle='#F6E3BC'; ctx.beginPath(); ctx.ellipse(-6,-5,4,2.5,-0.4,0,6.3); ctx.fill();
    ctx.fillStyle='#8A2B1C'; ctx.font='bold 7px sans-serif'; ctx.textAlign='center';
  } else if(kind==='star'){
    ctx.fillStyle='#F5C531'; star5(0,0,13,6.2);
    ctx.fillStyle='#FFF0B8'; star5(0,0,7,3.4);
  } else {
    ctx.fillStyle='#8B4A22';
    ctx.beginPath(); ctx.moveTo(-9,-10); ctx.lineTo(3,-10); ctx.lineTo(3,3);
    ctx.lineTo(12,3); ctx.lineTo(12,10); ctx.lineTo(-9,10); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#E8B33C'; ctx.fillRect(-9,10,21,4);
    ctx.fillStyle='#5C3116'; ctx.fillRect(-9,-6,12,3);
    ctx.strokeStyle='#C0C0C8'; ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<3;i++){ ctx.moveTo(-7,12+i*3); ctx.lineTo(10,12+i*3); }
    ctx.stroke();
  }
  ctx.restore();
}
function star5(cx,cy,R,r){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5, rad=i%2?r:R;
    ctx.lineTo(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad);
  }
  ctx.closePath(); ctx.fill();
}

// Both enemies keep the old hitboxes (38x26 and 34x32) on purpose. The art
// changed; the level's difficulty did not.
function drawScorpion(x,y,w,h,dir){
  ctx.save(); ctx.translate(x,y+h);
  if(dir<0) ctx.scale(-1,1);
  const t=Date.now()/150, step=Math.sin(t)*1.5, curl=Math.sin(t*0.7)*1.1;
  const shell='#8A5620', body='#653A12', dark='#3C2209', gloss='#B07A32';

  // eight legs, splayed out from under the body, alternating with the walk
  ctx.strokeStyle=dark; ctx.lineWidth=1.7; ctx.lineCap='round'; ctx.lineJoin='round';
  for(let i=0;i<4;i++){
    const lx=-8+i*4.6, s=(i%2)?step:-step;
    ctx.beginPath(); ctx.moveTo(lx,-8); ctx.lineTo(lx-4.5+s,-4); ctx.lineTo(lx-6.5+s,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx,-8); ctx.lineTo(lx+3.5-s,-4); ctx.lineTo(lx+5.5-s,0); ctx.stroke();
  }

  // tail: distinct beads arcing up over the back, stinger curling forward.
  // Kept inside the 26px hitbox so what you stomp is what you see.
  const seg=[[-12,-10],[-16,-14],[-16.5,-19],[-13,-22],[-8,-23]];
  ctx.strokeStyle=body; ctx.lineWidth=5; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(seg[0][0],seg[0][1]);
  for(let i=1;i<seg.length;i++) ctx.lineTo(seg[i][0],seg[i][1]-curl*(i/seg.length));
  ctx.stroke();
  ctx.fillStyle=gloss;
  for(let i=0;i<seg.length;i++){
    ctx.beginPath(); ctx.arc(seg[i][0],seg[i][1]-curl*(i/seg.length),2.4,0,6.3); ctx.fill();
  }
  ctx.fillStyle=dark;                                     // stinger
  ctx.beginPath();
  ctx.moveTo(-8,-25.5-curl); ctx.lineTo(-2,-21-curl); ctx.lineTo(-8.5,-20.5-curl);
  ctx.closePath(); ctx.fill();

  // abdomen, ridged
  ctx.fillStyle=shell;
  ctx.beginPath(); ctx.ellipse(-3,-9.5,10,5.4,0,0,6.3); ctx.fill();
  ctx.fillStyle=body;
  ctx.beginPath(); ctx.ellipse(-3,-9.5,10,5.4,0,Math.PI,0); ctx.fill();
  ctx.strokeStyle=dark; ctx.lineWidth=1;
  for(let i=-2;i<=2;i++){
    ctx.beginPath(); ctx.moveTo(-3+i*3.5,-14.6); ctx.lineTo(-3+i*3.5,-4.4); ctx.stroke();
  }
  // head plate
  ctx.fillStyle=shell;
  ctx.beginPath(); ctx.ellipse(8,-9.5,6,4.4,0,0,6.3); ctx.fill();

  // pincer arms reaching forward, claws opening and closing
  for(const s of [-1,1]){
    const ey=-9.5+s*3.6;
    ctx.strokeStyle=body; ctx.lineWidth=2.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(10,-9.5); ctx.lineTo(15,ey); ctx.stroke();
    ctx.fillStyle=shell;
    ctx.beginPath(); ctx.ellipse(17.4,ey,4.8,3,s*0.22,0,6.3); ctx.fill();
    const gap=1.6+step*0.4;
    ctx.strokeStyle=dark; ctx.lineWidth=1.5; ctx.lineCap='butt';
    ctx.beginPath();
    ctx.moveTo(21.8,ey-gap); ctx.lineTo(16.2,ey-0.3);
    ctx.moveTo(21.8,ey+gap); ctx.lineTo(16.2,ey+0.3);
    ctx.stroke();
  }

  // eyes
  ctx.fillStyle='#141414';
  ctx.beginPath(); ctx.arc(8,-11.8,1.4,0,6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(8,-7.4,1.4,0,6.3); ctx.fill();
  ctx.restore();
}
function drawRattler(x,y,w,h,phase,dir){
  ctx.save(); ctx.translate(x,y+h);
  if(dir<0) ctx.scale(-1,1);
  const sway=Math.sin(phase)*2.6, buzz=Math.sin(phase*3.2)*1.8;
  const tan='#BE9455', dk='#4E3A20', cream='#EBD9AC';

  // coiled base
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=tan; ctx.lineWidth=7.5;
  ctx.beginPath(); ctx.ellipse(-1,-6,w*0.40,5,0,0,6.3); ctx.stroke();
  ctx.strokeStyle=dk; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.ellipse(-1,-6,w*0.40,5,0,0,6.3); ctx.stroke();
  ctx.fillStyle=dk;                                      // diamond markings
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(i*9,-13); ctx.lineTo(i*9+3.2,-10); ctx.lineTo(i*9,-7); ctx.lineTo(i*9-3.2,-10);
    ctx.closePath(); ctx.fill();
  }

  // rattle, held up at the back and buzzing
  ctx.strokeStyle=tan; ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(-w*0.36,-8);
  ctx.quadraticCurveTo(-w*0.54,-16, -w*0.44+buzz,-23);
  ctx.stroke();
  ctx.fillStyle=cream;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.ellipse(-w*0.44+buzz*(0.7+i*0.2), -23-i*3.4, 3.1-i*0.35, 2.3, 0, 0, 6.3);
    ctx.fill();
  }

  // body rising into a strike-ready S
  ctx.strokeStyle=tan; ctx.lineWidth=6.4;
  ctx.beginPath();
  ctx.moveTo(-3,-9);
  ctx.quadraticCurveTo(8+sway,-15, 3+sway,-23);
  ctx.quadraticCurveTo(-1+sway,-29, 8+sway,-31);
  ctx.stroke();

  // head
  ctx.fillStyle=tan;
  ctx.beginPath(); ctx.ellipse(11+sway,-31.5,6.2,4.2,0.12,0,6.3); ctx.fill();
  ctx.fillStyle=dk;                                      // brow stripe
  ctx.beginPath(); ctx.ellipse(10+sway,-33.6,4.6,1.5,0.12,0,6.3); ctx.fill();
  ctx.fillStyle='#F2E27A';                               // eye
  ctx.beginPath(); ctx.arc(13.4+sway,-32.6,1.7,0,6.3); ctx.fill();
  ctx.fillStyle='#1A1A1A';
  ctx.fillRect(13.0+sway,-33.8,0.9,2.4);                 // slit pupil

  // forked tongue, flicked on part of the cycle
  if(Math.sin(phase*1.7)>0.45){
    ctx.strokeStyle='#C4324A'; ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(16.5+sway,-30.8); ctx.lineTo(21.5+sway,-30.2);
    ctx.moveTo(21.5+sway,-30.2); ctx.lineTo(24+sway,-31.4);
    ctx.moveTo(21.5+sway,-30.2); ctx.lineTo(24+sway,-29.2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGoal(x,gy){
  const sx=x-camX; if(sx>VW+200||sx<-260)return;
  ctx.fillStyle='#E8B33C';
  ctx.fillRect(x-4,gy-120,8,120);
  ctx.fillRect(x-52,gy-124,104,8);
  ctx.fillRect(x-52,gy-200,8,80);
  ctx.fillRect(x+44,gy-200,8,80);
  ctx.fillStyle='#CC0022'; ctx.fillRect(x-70,gy-236,140,28);
  ctx.fillStyle='#FFFFFF'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
  ctx.fillText('GO TROJANS',x,gy-217);
}

function drawTrojan(){
  const x=P.x, y=P.y, w=P.w, f=P.face;
  // Power-up transform: flicker between the old and the new size. Feet stay
  // planted because we translate to the real bottom (P.y+P.h) either way, so
  // only the drawn height changes.
  const h=(P.tf>0 && Math.floor(P.tf/4)%2===1) ? P.tfPrevH : P.h;
  ctx.save(); ctx.translate(x,P.y+P.h);
  // invincible flash
  let alpha=1;
  if(P.inv>0) alpha = 0.55+0.45*Math.sin(Date.now()/60);
  else if(P.invuln>0) alpha = (Math.floor(Date.now()/70)%2)?0.35:1;
  ctx.globalAlpha=alpha;
  if(f<0) ctx.scale(-1,1);

  const S=h/42; // scale for big form
  const run = P.onGround && Math.abs(P.vx)>0.5 ? Math.sin(P.anim/4.2) : 0;
  const air = !P.onGround;

  // cape
  ctx.fillStyle='#8E0018';
  ctx.beginPath();
  ctx.moveTo(-6*S,-h*0.72); ctx.quadraticCurveTo(-20*S,-h*0.45,-13*S-run*3,-h*0.06);
  ctx.lineTo(-4*S,-h*0.14); ctx.closePath(); ctx.fill();

  // legs
  ctx.fillStyle='#1E1E22';
  ctx.fillRect(-8*S,-h*0.30, 7*S, h*0.30 - (air?2:run*3));
  ctx.fillRect(1*S ,-h*0.30, 7*S, h*0.30 + (air?2:run*3));
  // sandals
  ctx.fillStyle='#8B6A3A';
  ctx.fillRect(-9*S,-3,9*S,3); ctx.fillRect(0,-3,9*S,3);

  // tunic / skirt
  ctx.fillStyle='#CC0022';
  ctx.beginPath();
  ctx.moveTo(-9*S,-h*0.52); ctx.lineTo(9*S,-h*0.52);
  ctx.lineTo(11*S,-h*0.28); ctx.lineTo(-11*S,-h*0.28); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#141414';
  for(let i=-2;i<=2;i++) ctx.fillRect(i*4.4*S-1,-h*0.34,2,h*0.06);

  // torso armor
  ctx.fillStyle='#1A1A1E';
  ctx.fillRect(-9*S,-h*0.72,18*S,h*0.22);
  ctx.fillStyle='#CC0022'; ctx.fillRect(-9*S,-h*0.72,18*S,4*S);
  ctx.fillStyle='#E8B33C'; ctx.fillRect(-2*S,-h*0.70,4*S,h*0.18);

  // shield arm (back), carrying a gold W for West
  ctx.fillStyle='#8E0018';
  ctx.beginPath(); ctx.arc(-11*S,-h*0.52,8*S,0,6.3); ctx.fill();
  ctx.strokeStyle='#E8B33C'; ctx.lineWidth=1.8*S;
  ctx.beginPath(); ctx.arc(-11*S,-h*0.52,8*S,0,6.3); ctx.stroke();
  // The W survives the facing flip on its own: a sans-serif W is horizontally
  // symmetric, so the scale(-1,1) above leaves it reading correctly.
  ctx.fillStyle='#E8B33C';
  ctx.font='bold '+(9*S).toFixed(1)+'px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('W',-11*S,-h*0.52);

  // sword arm
  ctx.fillStyle='#D8B48C';
  ctx.fillRect(7*S,-h*0.68,5*S,h*0.20);

  // short sword in the front hand, raised a little further on jumps
  ctx.save();
  ctx.translate(9.5*S,-h*0.47);
  ctx.rotate(0.34 + (air?-0.45:run*0.10));
  ctx.fillStyle='#5A3A1E'; ctx.fillRect(-1.7*S,-2*S,3.4*S,6.4*S);      // grip
  ctx.fillStyle='#E8B33C';
  ctx.beginPath(); ctx.arc(0,4.6*S,1.9*S,0,6.3); ctx.fill();            // pommel
  ctx.fillRect(-5*S,-3.6*S,10*S,2.4*S);                                 // crossguard
  ctx.fillStyle='#C7CCD4';                                              // blade
  ctx.beginPath();
  ctx.moveTo(-2.5*S,-3.6*S); ctx.lineTo(2.5*S,-3.6*S);
  ctx.lineTo(1.6*S,-15*S); ctx.lineTo(0,-18.5*S); ctx.lineTo(-1.6*S,-15*S);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#EFF2F6'; ctx.fillRect(-0.7*S,-14.5*S,1.4*S,10.5*S);   // fuller
  ctx.restore();

  // head
  ctx.fillStyle='#D8B48C';
  ctx.beginPath(); ctx.arc(1*S,-h*0.82,7*S,0,6.3); ctx.fill();

  // helmet
  ctx.fillStyle='#141414';
  ctx.beginPath(); ctx.arc(1*S,-h*0.84,8.2*S,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.fillRect(-7.2*S,-h*0.84,3.6*S,h*0.10);      // cheek guard back
  ctx.fillRect(5.6*S,-h*0.84,3.4*S,h*0.09);       // cheek guard front
  // nose guard
  ctx.fillRect(6.4*S,-h*0.86,2.2*S,h*0.12);
  // crest (mohawk plume) — red
  ctx.fillStyle='#CC0022';
  ctx.beginPath();
  ctx.moveTo(-5*S,-h*0.90);
  ctx.quadraticCurveTo(1*S,-h*1.06, 7*S,-h*0.90);
  ctx.quadraticCurveTo(1*S,-h*0.98,-5*S,-h*0.90);
  ctx.fill();
  ctx.fillStyle='#8E0018';
  for(let i=0;i<5;i++){
    ctx.fillRect(-4*S+i*2.4*S, -h*0.945-Math.sin(i/4*Math.PI)*3*S, 1.4*S, 4*S);
  }
  // eye
  ctx.fillStyle='#141414'; ctx.beginPath(); ctx.arc(4.6*S,-h*0.82,1.7*S,0,6.3); ctx.fill();

  ctx.globalAlpha=1;
  ctx.restore();

  // Ring bursting outward through the transform, so the pickup lands as an
  // event even for the two power-ups that do not change the Trojan's size.
  if(P.tf>0){
    ctx.save();
    ctx.globalAlpha=Math.max(0,P.tf/42)*0.7;
    ctx.strokeStyle='#E8B33C'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(P.x,P.y+P.h*0.5,P.h*0.55+(42-P.tf)*1.1,0,6.3); ctx.stroke();
    ctx.restore();
  }

  // sparkle trail when invincible
  if(P.inv>0 && P.anim%4===0){
    parts.push({x:P.x+(Math.random()-.5)*20,y:P.y+Math.random()*P.h,vx:(Math.random()-.5)*1.2,
      vy:-Math.random()*1.2,life:16,c:Math.random()<.5?'#E8B33C':'#FFF0B8'});
  }
}

/* ================= BOOT ================= */
var VERSION='2.0';
var errShown='', errCount=0;

// The version is in the HTML already. This only flips the flag to prove the
// script actually ran — if you see "JS NOT RUNNING" in red, it didn't.
function stampVersion(){
  try{
    var f=document.getElementById('jsflag');
    if(f){ f.textContent='JS OK'; f.className='ok'; }
    var v=document.getElementById('vtag');
    if(v) v.textContent='v'+VERSION;
  }catch(e){}
}
stampVersion();

// The error text used to live inside the start overlay, which is hidden while
// you play — so a mid-game failure was invisible. This bar is always on top.
function reportErr(e,where){
  try{
    var m=(e&&e.message)?e.message:String(e);
    var ln=(e&&e.lineno)?(' line '+e.lineno):'';
    var txt=(where?'['+where+'] ':'')+m+ln;
    errCount++;
    if(txt===errShown && errCount>1){
      var c0=document.querySelector('#errbar .cnt');
      if(c0) c0.textContent=' ×'+errCount;
      return;
    }
    errShown=txt;
    var bar=document.getElementById('errbar');
    if(bar){
      bar.innerHTML='<div class="hd">ERROR · BUILD '+VERSION+' · tap to dismiss</div>'+
        '<span class="msg"></span><span class="cnt"></span>';
      bar.querySelector('.msg').textContent=txt;
      bar.querySelector('.cnt').textContent=errCount>1?(' ×'+errCount):'';
      bar.style.display='block';
    }
    if(window.console&&console.error) console.error(txt,e);
  }catch(err){}
}
(function(){
  var bar=document.getElementById('errbar');
  if(bar){
    var dismiss=function(ev){ ev.preventDefault(); bar.style.display='none'; };
    bar.addEventListener('touchstart',dismiss,{passive:false});
    bar.addEventListener('click',dismiss);
  }
})();
window.addEventListener('error',function(e){ reportErr(e,'js'); });
window.addEventListener('unhandledrejection',function(e){ reportErr(e.reason||{message:'promise rejected'},'promise'); });

try{
  resize();
  seedFruit(); seedEnemies();
  hFruitT.textContent=fruit.length;
  P.y=GROUND-P.h;
  showMsg('WEST TROJAN RUN','MAIN STREET · WEST, TEXAS',
    ['Run the length of Main Street, grab the fruit, dodge the scorpions and rattlesnakes, and reach the goal posts.',
     '◀ ▶ to move · JUMP to hop · stomp enemies from above'],'START');
  stampVersion();
}catch(e){ reportErr(e,'boot'); }

setTimeout(queueResize,120); setTimeout(queueResize,600);

document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    IN.l=IN.r=false; IN.jumpHold=false; IN.jumpQ=false;
    try{ if(AC&&AC.suspend) AC.suspend(); }catch(e){}
  } else {
    try{ if(AC&&AC.resume) AC.resume(); }catch(e){}
    queueResize();
  }
});

// Watchdog: if frames stop arriving while the page is still alive, say so
// instead of just sitting there looking frozen.
var lastFrame=Date.now(), watchdogFired=false;
setInterval(function(){
  if(document.hidden) { lastFrame=Date.now(); return; }
  var gap=Date.now()-lastFrame;
  if(gap>2500 && !watchdogFired){
    watchdogFired=true;
    reportErr({message:'render stalled '+Math.round(gap/100)/10+'s (frames stopped)'},'watchdog');
  }
},1000);

var frameErrs=0;
function loop(){
  lastFrame=Date.now(); watchdogFired=false;
  try{ update(); draw(); }
  catch(err){
    try{ ctx.setTransform(1,0,0,1,0,0); }catch(e){}
    frameErrs++;
    reportErr(err,'frame'+frameErrs);
    if(frameErrs===12) cacheOK=false;   // suspect the bitmap path, fall back
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>

<script>
/* Install / offline glue.
 *
 * Deliberately OUTSIDE the game's IIFE: if any of this throws, the game must
 * still boot and play. Nothing in here touches game state.
 */
(function(){
"use strict";
var ua=navigator.userAgent;
var isIOS=/iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); // iPadOS 13+ lies
var installed = window.navigator.standalone===true ||
  (window.matchMedia && window.matchMedia(
    '(display-mode: fullscreen), (display-mode: standalone), (display-mode: minimal-ui)').matches);

/* Android + desktop Chrome: a real install prompt. Chrome hands us the event
   only when the app qualifies, so the button stays hidden unless it fires. */
var btn=document.getElementById('installBtn'), deferred=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferred=e;
  if(btn && !installed) btn.hidden=false;
});
if(btn) btn.addEventListener('click',function(){
  if(!deferred) return;
  btn.hidden=true;
  try{ deferred.prompt(); }catch(err){}
  var done=function(){ deferred=null; };
  if(deferred && deferred.userChoice) deferred.userChoice.then(done,done);
});
window.addEventListener('appinstalled',function(){
  deferred=null; if(btn) btn.hidden=true;
});

/* iOS has no install API at all, so the only option is to name the gesture. */
var tip=document.getElementById('iosTip');
if(tip && isIOS && !installed){
  tip.innerHTML = /CriOS|FxiOS|EdgiOS/.test(ua)
    ? 'Open this page in <b>Safari</b> to install it &mdash; other iOS browsers cannot add it to the Home Screen.'
    : 'Install it: tap <b>Share</b>, then <b>Add to Home Screen</b>.';
  tip.hidden=false;
}

/* Offline support. file:// has no service worker support and is a supported way
   to run this game, so bailing out there is expected, not a failure. The worker
   serves the HTML network-first, so this never makes a stale build stickier. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js')['catch'](function(){});
  });
}
})();
</script>
